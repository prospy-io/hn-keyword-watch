[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hn-keyword-watch"
version = "0.1.0"
description = "Watch Hacker News for keywords and buying-intent phrases using the official HN and Algolia APIs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prospy" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["hacker-news", "social-listening", "keyword-monitoring", "lead-generation", "algolia"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Internet",
]

[project.urls]
Homepage = "https://prospy.io"
Repository = "https://codeberg.org/prospy/hn-keyword-watch"
Issues = "https://codeberg.org/prospy/hn-keyword-watch/issues"

[project.scripts]
hn-keyword-watch = "hn_keyword_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
